<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">색인 배치가 저장해 둔 것을 질의 경로의 검색이 읽는 구조</title>
  <desc id="desc">매일 도는 색인 배치가 문서를 수집해 청킹하고 메타데이터를 붙여 저장합니다. 요청마다 도는 질의 경로는 질문을 재작성한 뒤 검색하고 답을 만듭니다. 검색은 색인이 저장해 둔 것만 읽으므로, 청킹한 단위가 검색 결과를 좌우합니다. 청킹·메타데이터·재작성·검색 네 곳이 고친 자리입니다.</desc>
  <rect width="1200" height="560" fill="#fbfaf6"/>

  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <text x="64" y="72" fill="#181a20" font-size="34" font-weight="700">검색은 색인이 저장해 둔 것만 읽습니다</text>
    <text x="64" y="110" fill="#5d6068" font-size="19">그래서 청킹한 단위가 검색 결과를 좌우합니다. 파란 칸이 고친 네 자리입니다.</text>

    <!-- 색인 레인 -->
    <text x="64" y="170" fill="#5d6068" font-size="16" font-weight="700">색인 · 매일 배치</text>
    <rect x="64" y="184" width="1072" height="96" rx="4" fill="#ffffff" stroke="#d8d9df"/>

    <g transform="translate(96 210)">
      <rect width="196" height="44" rx="4" fill="#f2f1ec"/>
      <text x="98" y="28" fill="#181a20" font-size="19" text-anchor="middle">문서 수집</text>
      <path d="M212 22h44" stroke="#5d6068" stroke-width="2"/>
      <path d="m249 15 8 7-8 7" fill="none" stroke="#5d6068" stroke-width="2"/>
    </g>
    <g transform="translate(368 210)">
      <rect width="196" height="44" rx="4" fill="#ffffff" stroke="#2955d9" stroke-width="2"/>
      <text x="98" y="28" fill="#2955d9" font-size="19" font-weight="700" text-anchor="middle">청킹</text>
      <path d="M212 22h44" stroke="#5d6068" stroke-width="2"/>
      <path d="m249 15 8 7-8 7" fill="none" stroke="#5d6068" stroke-width="2"/>
    </g>
    <g transform="translate(640 210)">
      <rect width="196" height="44" rx="4" fill="#ffffff" stroke="#2955d9" stroke-width="2"/>
      <text x="98" y="28" fill="#2955d9" font-size="19" font-weight="700" text-anchor="middle">메타데이터</text>
      <path d="M212 22h44" stroke="#5d6068" stroke-width="2"/>
      <path d="m249 15 8 7-8 7" fill="none" stroke="#5d6068" stroke-width="2"/>
    </g>
    <g transform="translate(912 210)">
      <rect width="196" height="44" rx="4" fill="#eef2fd" stroke="#2955d9"/>
      <text x="98" y="28" fill="#181a20" font-size="19" text-anchor="middle">저장</text>
    </g>

    <!-- 저장 → 검색 : 꺾어서 검색 칸에 꽂는다 -->
    <path d="M1010 254v62H620v78" fill="none" stroke="#2955d9" stroke-width="2.5"/>
    <path d="m612 331 8 9 8-9" fill="none" stroke="#2955d9" stroke-width="2.5"/>
    <rect x="686" y="298" width="272" height="30" rx="4" fill="#fbfaf6"/>
    <text x="822" y="319" fill="#2955d9" font-size="16" font-weight="700" text-anchor="middle">색인해 둔 것만 검색됩니다</text>

    <!-- 질의 레인 -->
    <text x="64" y="382" fill="#5d6068" font-size="16" font-weight="700">질의 · 요청마다</text>
    <rect x="64" y="396" width="1072" height="96" rx="4" fill="#ffffff" stroke="#d8d9df"/>

    <g transform="translate(96 422)">
      <rect width="152" height="44" rx="4" fill="#f2f1ec"/>
      <text x="76" y="28" fill="#181a20" font-size="19" text-anchor="middle">질문</text>
      <path d="M168 22h40" stroke="#5d6068" stroke-width="2"/>
      <path d="m201 15 8 7-8 7" fill="none" stroke="#5d6068" stroke-width="2"/>
    </g>
    <g transform="translate(320 422)">
      <rect width="152" height="44" rx="4" fill="#ffffff" stroke="#2955d9" stroke-width="2"/>
      <text x="76" y="28" fill="#2955d9" font-size="19" font-weight="700" text-anchor="middle">재작성</text>
      <path d="M168 22h40" stroke="#5d6068" stroke-width="2"/>
      <path d="m201 15 8 7-8 7" fill="none" stroke="#5d6068" stroke-width="2"/>
    </g>
    <g transform="translate(544 422)">
      <rect width="152" height="44" rx="4" fill="#ffffff" stroke="#2955d9" stroke-width="2"/>
      <text x="76" y="28" fill="#2955d9" font-size="19" font-weight="700" text-anchor="middle">검색</text>
      <path d="M168 22h40" stroke="#5d6068" stroke-width="2"/>
      <path d="m201 15 8 7-8 7" fill="none" stroke="#5d6068" stroke-width="2"/>
    </g>
    <g transform="translate(768 422)">
      <rect width="152" height="44" rx="4" fill="#f2f1ec"/>
      <text x="76" y="28" fill="#181a20" font-size="19" text-anchor="middle">생성</text>
      <path d="M168 22h40" stroke="#5d6068" stroke-width="2"/>
      <path d="m201 15 8 7-8 7" fill="none" stroke="#5d6068" stroke-width="2"/>
    </g>
    <g transform="translate(992 422)">
      <rect width="144" height="44" rx="4" fill="#f2f1ec"/>
      <text x="72" y="28" fill="#181a20" font-size="19" text-anchor="middle">답변</text>
    </g>
  </g>
</svg>
