<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">기능 개발 전에 환경 조건을 먼저 확정한 순서</title>
  <desc id="desc">환경 확인을 개발 뒤로 미루면 기능을 다 만든 뒤 현업 테스트가 멈춥니다. 요구사항 분석 다음에 통신 대상과 테스트 환경을 먼저 확정하는 순서로 일했습니다.</desc>
  <rect width="1200" height="540" fill="#fbfaf6"/>
  <text x="64" y="76" fill="#181a20" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="34" font-weight="700">기능보다 먼저 열려야 하는 것들을 앞으로 옮겼습니다</text>
  <text x="64" y="114" fill="#5d6068" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="19">연동 대상이나 방화벽 기안이 하나 빠지면, 기능을 다 만든 뒤에 현업 테스트가 멈춥니다.</text>

  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <text x="64" y="180" fill="#5d6068" font-size="16" font-weight="700">환경 확인을 뒤로 미루면</text>

    <rect x="64" y="196" width="236" height="72" rx="4" fill="#ffffff" stroke="#d8d9df"/>
    <text x="88" y="228" fill="#181a20" font-size="18" font-weight="700">요구사항 분석</text>
    <text x="88" y="252" fill="#5d6068" font-size="15">화면 · API · 연동 · 데이터</text>
    <path d="M314 232h30" stroke="#d8d9df" stroke-width="2"/>
    <path d="m339 225 8 7-8 7" fill="none" stroke="#d8d9df" stroke-width="2"/>

    <rect x="360" y="196" width="236" height="72" rx="4" fill="#ffffff" stroke="#d8d9df"/>
    <text x="384" y="228" fill="#181a20" font-size="18" font-weight="700">기능 개발</text>
    <text x="384" y="252" fill="#5d6068" font-size="15">Java · Spring 구현</text>
    <path d="M610 232h30" stroke="#d8d9df" stroke-width="2"/>
    <path d="m635 225 8 7-8 7" fill="none" stroke="#d8d9df" stroke-width="2"/>

    <rect x="656" y="196" width="236" height="72" rx="4" fill="#ffffff" stroke="#d8d9df"/>
    <text x="680" y="228" fill="#181a20" font-size="18" font-weight="700">환경 확인</text>
    <text x="680" y="252" fill="#5d6068" font-size="15">방화벽 · 계정 · 이중화</text>
    <path d="M906 232h30" stroke="#d8d9df" stroke-width="2"/>
    <path d="m931 225 8 7-8 7" fill="none" stroke="#d8d9df" stroke-width="2"/>

    <rect x="952" y="196" width="184" height="72" rx="4" fill="#ffffff" stroke="#2955d9" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="976" y="228" fill="#2955d9" font-size="18" font-weight="700">테스트 대기</text>
    <text x="976" y="252" fill="#5d6068" font-size="15">가장 비싼 구간</text>
  </g>

  <g font-family="Pretendard, Apple SD Gothic Neo, sans-serif">
    <text x="64" y="332" fill="#2955d9" font-size="16" font-weight="700">제가 일한 순서</text>

    <rect x="64" y="348" width="196" height="72" rx="4" fill="#ffffff" stroke="#d8d9df"/>
    <text x="86" y="380" fill="#181a20" font-size="18" font-weight="700">요구사항 분석</text>
    <text x="86" y="404" fill="#5d6068" font-size="15">조건으로 쪼개기</text>
    <path d="M274 384h26" stroke="#2955d9" stroke-width="2"/>
    <path d="m295 377 8 7-8 7" fill="none" stroke="#2955d9" stroke-width="2"/>

    <rect x="316" y="348" width="196" height="72" rx="4" fill="#2955d9"/>
    <text x="338" y="380" fill="#ffffff" font-size="18" font-weight="700">환경 확정</text>
    <text x="338" y="404" fill="#ffffff" font-size="15" opacity="0.85">고객 담당자와 합의</text>
    <path d="M526 384h26" stroke="#2955d9" stroke-width="2"/>
    <path d="m547 377 8 7-8 7" fill="none" stroke="#2955d9" stroke-width="2"/>

    <rect x="568" y="348" width="196" height="72" rx="4" fill="#ffffff" stroke="#d8d9df"/>
    <text x="590" y="380" fill="#181a20" font-size="18" font-weight="700">기능 개발</text>
    <text x="590" y="404" fill="#5d6068" font-size="15">상담 상태 · 기간계</text>
    <path d="M778 384h26" stroke="#2955d9" stroke-width="2"/>
    <path d="m799 377 8 7-8 7" fill="none" stroke="#2955d9" stroke-width="2"/>

    <rect x="820" y="348" width="152" height="72" rx="4" fill="#ffffff" stroke="#d8d9df"/>
    <text x="842" y="380" fill="#181a20" font-size="18" font-weight="700">현업 테스트</text>
    <text x="842" y="404" fill="#5d6068" font-size="15">막힘 없이 진행</text>
    <path d="M986 384h26" stroke="#2955d9" stroke-width="2"/>
    <path d="m1007 377 8 7-8 7" fill="none" stroke="#2955d9" stroke-width="2"/>

    <rect x="1028" y="348" width="108" height="72" rx="4" fill="#2955d9"/>
    <text x="1082" y="380" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">운영</text>
    <text x="1082" y="404" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">이행</text>
  </g>

  <line x1="64" y1="460" x2="1136" y2="460" stroke="#d8d9df"/>
  <text x="64" y="502" fill="#181a20" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="18" font-weight="700">확인 범위</text>
  <text x="172" y="502" fill="#5d6068" font-family="Pretendard, Apple SD Gothic Neo, sans-serif" font-size="17">iOS·Android와 브라우저 4종을 조합한 8개 환경 · 고객명과 망 구성은 공개 자료에서 제외</text>
</svg>
