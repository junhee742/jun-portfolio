<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">이준희 백엔드 개발자 포트폴리오</title>
  <desc id="desc">금융권 온프레미스 구축과 AI Agent·RAG 제품을 모두 맡아 온 4년 차 백엔드 개발자와 직접 확인한 결과 네 가지</desc>
  <rect width="1200" height="630" fill="#fbfaf6"/>

  <g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif">
    <text x="64" y="52" fill="#181a20" font-size="22" font-weight="700">이준희</text>
    <text x="1136" y="52" fill="#5d6068" font-size="16" text-anchor="end">B2B 백엔드 · 고객사 구축과 AI 제품</text>
    <line x1="0" y1="76" x2="1200" y2="76" stroke="#d8d9df"/>

    <text x="64" y="156" fill="#2955d9" font-size="16" font-weight="700" letter-spacing="1.1">2022.11 — 현재 · (주)스펙트라 제품개발부</text>

    <text x="64" y="236" fill="#181a20" font-size="52" font-weight="800" letter-spacing="-2">만드는 것보다 확인하는 데</text>
    <text x="64" y="304" fill="#181a20" font-size="52" font-weight="800" letter-spacing="-2">시간을 더 씁니다.</text>

    <text x="64" y="356" fill="#5d6068" font-size="20">금융권 온프레미스 구축과 AI Agent·RAG 제품을 모두 맡아 온 4년 차 백엔드 개발자입니다.</text>

    <line x1="64" y1="414" x2="1136" y2="414" stroke="#181a20" stroke-width="2"/>
    <text x="64" y="446" fill="#5d6068" font-size="15">직접 확인한 결과 · 내부 검증환경 기준</text>

    <g transform="translate(64 486)">
      <text x="0" y="36" fill="#181a20" font-size="34" font-weight="800" letter-spacing="-1.4">54/54</text>
      <text x="0" y="66" fill="#181a20" font-size="15" font-weight="700">AI 답변 회귀검증 통과</text>
      <text x="0" y="90" fill="#5d6068" font-size="13">변경 전 44/54</text>
    </g>

    <line x1="316" y1="480" x2="316" y2="592" stroke="#d8d9df"/>
    <g transform="translate(348 486)">
      <text x="0" y="36" fill="#181a20" font-size="34" font-weight="800" letter-spacing="-1.4">80.7%</text>
      <text x="0" y="66" fill="#181a20" font-size="15" font-weight="700">한 서비스 코드 실행 범위</text>
      <text x="0" y="90" fill="#5d6068" font-size="13">테스트 755개</text>
    </g>

    <line x1="616" y1="480" x2="616" y2="592" stroke="#d8d9df"/>
    <g transform="translate(648 486)">
      <text x="0" y="36" fill="#181a20" font-size="34" font-weight="800" letter-spacing="-1.4">21/21</text>
      <text x="0" y="66" fill="#181a20" font-size="15" font-weight="700">예약 작업 정확히 한 번씩</text>
      <text x="0" y="90" fill="#5d6068" font-size="13">중복 0건</text>
    </g>

    <line x1="884" y1="480" x2="884" y2="592" stroke="#d8d9df"/>
    <g transform="translate(916 486)">
      <text x="0" y="36" fill="#181a20" font-size="34" font-weight="800" letter-spacing="-1.4">8시간 → 1시간</text>
      <text x="0" y="66" fill="#181a20" font-size="15" font-weight="700">반복 SQL 작성 시간</text>
      <text x="0" y="90" fill="#5d6068" font-size="13">DB 객체 450개</text>
    </g>
